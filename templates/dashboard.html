<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('logo') }}">
  <link rel="shortcut icon" href="{{ url_for('logo') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ── CSS VARIABLES ──────────────────────────────────────────────────── */
    :root {
      --bg:          #0b0e14;
      --surface:     #111620;
      --surface2:    #181e2d;
      --border:      #1e2840;
      --border2:     #263050;
             TAB: INBOUND (live data)
    ══════════════════════════════════════════════════════════════════════ -->
    <div id="tab-inbound" class="tab-panel{% if active_tab == 'inbound' %} active{% endif %}">
      <div class="page-header">
        <div>
          <div class="page-title">Inbound <span>Trips</span></div>
          <div class="page-subtitle">Juba → Nimule → Malaba → Depot Nakuru</div>
          <div class="page-timestamp">{{ last_updated }}</div>
        </div>
        <span class="tag tag-amber">🔄 Inbound</span>
      </div>

      <div class="section-card">
        <div class="section-head">
          <div class="section-title"><span class="icon">🔄</span> Return Journey</div>
          <span class="tag tag-green">Checkpoint timestamps in EAT</span>
        </div>
        <div class="table-controls">
          <input class="search-input" type="text" placeholder="Search vehicle…" oninput="filterTable('table-inbound', this.value)">
        </div>
        <div class="table-wrap" id="table-inbound">{{ inbound_table|safe }}</div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════════
         TAB: TAT (live data)
    ══════════════════════════════════════════════════════════════════════ -->
    <div id="tab-tat" class="tab-panel{% if active_tab == 'tat' %} active{% endif %}">
      <div class="page-header">
        <div>
          <div class="page-title">Turnaround <span>Time</span></div>
          <div class="page-subtitle">Outbound + Inbound combined · Full round-trip back to Depot</div>
          <div class="page-timestamp">{{ last_updated }}</div>
        </div>
        <span class="tag tag-blue">⏱ TAT</span>
      </div>

      <div class="section-card">
        <div class="section-head">
          <div class="section-title"><span class="icon">⏱</span> Full Round-Trip TAT per Vehicle</div>
          <span class="tag tag-amber">Depot Departure → Depot Return</span>
        </div>
        <div class="table-controls">
          <input class="search-input" type="text" placeholder="Search vehicle…" oninput="filterTable('table-tat', this.value)">
        </div>
        <div class="table-wrap" id="table-tat">{{ tat_table|safe }}</div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════════
         TAB: MILEAGE (live data) — Table FIRST, chart below
    ══════════════════════════════════════════════════════════════════════ -->
    <div id="tab-mileage" class="tab-panel{% if active_tab == 'mileage' %} active{% endif %}">
      <div class="page-header">
        <div>
          <div class="page-title">Mileage <span>Analytics</span></div>
          <div class="page-subtitle">Adjusted and actual distance per vehicle</div>
          <div class="page-timestamp">{{ last_updated }}</div>
        </div>
      </div>

      <!-- Table first -->
      <div class="section-card" style="margin-bottom:24px;">
        <div class="section-head">
          <div class="section-title"><span class="icon">⛽</span> Mileage Table</div>
        </div>
        <div class="table-controls">
          <input class="search-input" type="text" placeholder="Search vehicle…" oninput="filterTable('table-mileage', this.value)">
        </div>
        <div class="table-wrap" id="table-mileage">{{ mileage_table|safe }}</div>
      </div>

      <!-- Chart below -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-title"><span class="icon">📈</span> Distance Overview</div>
        </div>
        <div class="mileage-bars" id="mileage-bars">
          <div class="empty-state"><div class="empty-icon">⛽</div><div class="empty-text">Loading mileage data…</div></div>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════════
         TAB: DESTINATIONS
    ══════════════════════════════════════════════════════════════════════ -->
    <div id="tab-destinations" class="tab-panel{% if active_tab == 'destinations' %} active{% endif %}">
      <div class="page-header">
        <div>
          <div class="page-title">Destination <span>Tracking</span></div>
          <div class="page-subtitle">Filter by destination to view vehicles currently assigned there</div>
          <div class="page-timestamp">{{ last_updated }}</div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-head">
          <div class="section-title"><span class="icon">📍</span> Destination Fleet View</div>
        </div>
        <div class="table-controls">
          <select class="search-input" id="destination-filter" onchange="filterByDestination()">
            <option value="">All Destinations</option>
            {% for destination in destination_options %}
              <option value="{{ destination }}">{{ destination }}</option>
            {% endfor %}
          </select>
          <input class="search-input" type="text" placeholder="Search vehicle…" oninput="filterTable('table-destinations', this.value)">
        </div>
        <div class="table-wrap" id="table-destinations">{{ destinations_table|safe }}</div>
      </div>
    </div>

  </main>
</div><!-- /layout -->

<script>
/* ── LIVE CLOCK (EAT = UTC+3) ───────────────────────────────────────────── */
function tickClock() {
  const now = new Date();
  const eat = new Date(now.getTime() + 3 * 3600 * 1000);
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock-time').textContent =
    `${eat.getUTCFullYear()}-${pad(eat.getUTCMonth()+1)}-${pad(eat.getUTCDate())} ` +
    `${pad(eat.getUTCHours())}:${pad(eat.getUTCMinutes())}:${pad(eat.getUTCSeconds())}`;
}
tickClock(); setInterval(tickClock, 1000);

/* ── NAVIGATION ─────────────────────────────────────────────────────────── */
function showTab(name, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');

  if (name === 'mileage')  buildMileageBars('table-mileage', 'mileage-bars');
  if (name === 'report')   { buildMileageBars('table-rpt-mil', 'rpt-mileage-bars'); highlightTAT('table-rpt-tat'); }
  if (name === 'tat')      highlightTAT('table-tat');
  if (name === 'outbound') styleComputedCols('table-outbound');
  if (name === 'inbound')  styleComputedCols('table-inbound');
}

/* ── INNER TABS (report sub-tabs) ───────────────────────────────────────── */
function showInner(id, el) {
  const card = el.closest('.section-card');
  card.querySelectorAll('.inner-tab').forEach(t => t.classList.remove('active'));
  card.querySelectorAll('.inner-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(id).classList.add('active');
  if (id === 'rpt-mileage') buildMileageBars('table-rpt-mil', 'rpt-mileage-bars');
  if (id === 'rpt-tat')     highlightTAT('table-rpt-tat');
}

/* ── TABLE SEARCH ───────────────────────────────────────────────────────── */
function filterTable(wrapperId, query) {
  const wrap = document.getElementById(wrapperId);
  if (!wrap) return;
  const q = query.toLowerCase();
  wrap.querySelectorAll('tbody tr').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function applyLiveFilters() {
  const wrap = document.getElementById('table-live');
  if (!wrap) return;
  const q = (document.getElementById('search-live')?.value || '').toLowerCase();
  const status = (document.getElementById('live-status-filter')?.value || '').toLowerCase();
  wrap.querySelectorAll('tbody tr').forEach(row => {
    const txt = (row.textContent || '').toLowerCase();
    const searchOk = txt.includes(q);
    let statusOk = true;
    if (status === 'moving') statusOk = txt.includes('moving');
    if (status === 'stationary') statusOk = txt.includes('stationary');
    row.style.display = (searchOk && statusOk) ? '' : 'none';
  });
}

function filterByDestination() {
  const select = document.getElementById('destination-filter');
  const wrap   = document.getElementById('table-destinations');
  if (!select || !wrap) return;
  const table = wrap.querySelector('table');
  if (!table) return;
  const headers = [...table.querySelectorAll('thead th')];
  const destCol = headers.findIndex(h => h.textContent.toLowerCase().includes('destination'));
  if (destCol < 0) return;
  const selected = (select.value || '').toLowerCase();
  table.querySelectorAll('tbody tr').forEach(row => {
    if (!selected) { row.style.display = ''; return; }
    const cells = row.querySelectorAll('td');
    const value = (cells[destCol]?.textContent || '').toLowerCase();
    row.style.display = value.includes(selected) ? '' : 'none';
  });
}

/* ── STYLE COMPUTED DURATION COLUMNS ────────────────────────────────────── */
const COMPUTED_HEADERS = [
  'average time', 'transit to', 'time spent', 'tat', 'turnaround',
  'outbound transit', 'inbound transit', 'time at juba'
];
function styleComputedCols(wrapperId) {
  const wrap = document.getElementById(wrapperId);
  if (!wrap) return;
  const table = wrap.querySelector('table');
  if (!table) return;
  const headers = [...table.querySelectorAll('thead th')];
  const cols = new Set();
  headers.forEach((th, i) => {
    const t = th.textContent.trim().toLowerCase();
    if (COMPUTED_HEADERS.some(h => t.includes(h))) cols.add(i);
  });
  table.querySelectorAll('tbody tr').forEach(row => {
    [...row.querySelectorAll('td')].forEach((td, i) => {
      if (cols.has(i) && td.textContent.trim() && td.textContent.trim() !== '0') {
        td.classList.add('computed-col');
      }
    });
  });
}

/* ── HIGHLIGHT TAT COLUMN ───────────────────────────────────────────────── */
function highlightTAT(wrapperId) {
  const wrap = document.getElementById(wrapperId);
  if (!wrap) return;
  const table = wrap.querySelector('table');
  if (!table) return;
  const headers = [...table.querySelectorAll('thead th')];
  const tatIdx  = headers.findIndex(h => h.textContent.toLowerCase().includes('full round'));
  if (tatIdx < 0) return;
  table.querySelectorAll(`tbody tr td:nth-child(${tatIdx + 1})`).forEach(td => {
    if (td.textContent.trim()) td.classList.add('tat-cell');
  });
}

/* ── MILEAGE BARS ───────────────────────────────────────────────────────── */
function buildMileageBars(tableId, barsId) {
  const barsEl = document.getElementById(barsId);
  const table  = document.querySelector('#' + tableId + ' table');
  if (!table || !barsEl) return;

  const headers    = [...table.querySelectorAll('thead th')].map(th => th.textContent.trim());
  const vehicleIdx = headers.findIndex(h => h.toLowerCase().includes('vehicle'));
  const mileageIdx = headers.findIndex(h =>
    h.toLowerCase() === 'mileage (km)' || h.toLowerCase().includes('adjusted mileage'));
  if (vehicleIdx < 0 || mileageIdx < 0) return;

  const rows = [...table.querySelectorAll('tbody tr')].map(tr => {
    const cells = [...tr.querySelectorAll('td')];
    return {
      vehicle: cells[vehicleIdx]?.textContent.trim() || '',
      km:      parseFloat(cells[mileageIdx]?.textContent.replace(/[^\d.]/g,'')) || 0
    };
  }).filter(r => r.vehicle && r.km > 0);

  if (!rows.length) { barsEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⛽</div><div class="empty-text">No mileage data.</div></div>'; return; }
  const maxKm = Math.max(...rows.map(r => r.km), 1);
  barsEl.innerHTML = rows.map(r => `
    <div class="mileage-row">
      <div class="mileage-label" title="${r.vehicle}">${r.vehicle}</div>
      <div class="mileage-track">
        <div class="mileage-fill" style="width:${(r.km/maxKm*100).toFixed(1)}%"></div>
      </div>
      <div class="mileage-km">${r.km.toFixed(1)} km</div>
    </div>
  `).join('');
}

/* ── FILE UPLOAD FEEDBACK ────────────────────────────────────────────────── */
function handleFileSelect(input) {
  const display = document.getElementById('file-name-display');
  const btn     = document.getElementById('upload-btn');
  if (input.files && input.files[0]) {
    const name = input.files[0].name;
    display.innerHTML =
      `<strong style="color:var(--accent)">📄 ${name}</strong> — ready to analyse`;
    // Enable the submit button now that a file is chosen
    if (btn) btn.disabled = false;
  } else {
    display.innerHTML =
      'Upload a CSV / XLSX with a <strong>Vehicle</strong> column — reports will be generated for those vehicles only';
    if (btn) btn.disabled = true;
  }
}

/* ── DRAG & DROP ─────────────────────────────────────────────────────────── */
const uploadCard = document.getElementById('upload-card');
const uploadDrop = document.getElementById('upload-drop');
if (uploadCard && uploadDrop) {
  // Highlight card on drag-over
  ['dragover', 'dragenter'].forEach(evt =>
    uploadCard.addEventListener(evt, e => { e.preventDefault(); uploadCard.classList.add('dragover'); })
  );
  ['dragleave', 'dragend'].forEach(evt =>
    uploadCard.addEventListener(evt, () => uploadCard.classList.remove('dragover'))
  );
  uploadCard.addEventListener('drop', e => {
    e.preventDefault();
    uploadCard.classList.remove('dragover');
    const fi = document.getElementById('file-input');
    if (e.dataTransfer.files.length) {
      const dt = new DataTransfer();
      dt.items.add(e.dataTransfer.files[0]);
      fi.files = dt.files;
      handleFileSelect(fi);
    }
  });
}

/* ── INIT ON LOAD ────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  const dsAt = document.body.dataset.activeTab || 'live';
  const dsIn = document.body.dataset.activeInner || '';
  if (dsAt && dsAt !== 'live') {
    const nav = [...document.querySelectorAll('.nav-item')].find(el => {
      const oc = el.getAttribute('onclick') || '';
      return oc.includes(`'${dsAt}'`);
    });
    if (nav) showTab(dsAt, nav);
  }
  if (dsAt === 'report' && dsIn) {
    const innerBtn = document.querySelector(`#tab-report .inner-tab[onclick*="'${dsIn}'"]`);
    if (innerBtn) showInner(dsIn, innerBtn);
  }

  // Remove pandas dataframe class artifacts
  document.querySelectorAll('.table-wrap table').forEach(t => {
    t.classList.remove('dataframe');
    t.removeAttribute('border');
  });

  // Badge speed cells in live table
  const liveWrap = document.getElementById('table-live');
  if (liveWrap) {
    const headers  = [...(liveWrap.querySelector('thead tr')?.querySelectorAll('th') || [])];
    const speedIdx = headers.findIndex(h => h.textContent.toLowerCase().includes('speed'));
    if (speedIdx >= 0) {
      liveWrap.querySelectorAll(`tbody tr td:nth-child(${speedIdx+1})`).forEach(td => {
        const v = parseFloat(td.textContent);
        if (!isNaN(v)) {
          td.innerHTML = `<span class="speed-badge ${v > 0 ? 'active' : ''}">${v} km/h</span>`;
        }
      });
    }
  }

  // Style computed duration columns in outbound / inbound
  styleComputedCols('table-outbound');
  styleComputedCols('table-inbound');
  styleComputedCols('table-rpt-ob');
  styleComputedCols('table-rpt-ib');

  // TAT highlights
  highlightTAT('table-tat');
  highlightTAT('table-rpt-tat');

  // Build mileage bars for whichever panel might be visible
  buildMileageBars('table-mileage',  'mileage-bars');
  buildMileageBars('table-rpt-mil',  'rpt-mileage-bars');

  // Replace 0 / blank timestamps with dash
  document.querySelectorAll('.table-wrap tbody td').forEach(td => {
    const v = td.textContent.trim();
    if (v === '0' || v === '0.0' || v === 'NaT' || v === 'nan') {
      td.innerHTML = '<span style="color:var(--text3)">—</span>';
    }
  });

  // Clear selected upload file after Upload & Analyse response.
  const hadUploadMessage = document.body.dataset.uploadMsg === '1';
  if (hadUploadMessage) {
    const fi      = document.getElementById('file-input');
    const display = document.getElementById('file-name-display');
    const btn     = document.getElementById('upload-btn');
    if (fi) fi.value = '';
    if (display) {
      display.innerHTML =
        'Upload a CSV / XLSX with a <strong>Vehicle</strong> column — reports will be generated for those vehicles only';
    }
    // Keep button disabled until next file is chosen
    if (btn) btn.disabled = true;

    // Keep user on Reports tab after Upload & Analyse.
    const reportNav = [...document.querySelectorAll('.nav-item')]
      .find(el => (el.textContent || '').toLowerCase().includes('reports'));
    if (reportNav) showTab('report', reportNav);
  }
});
</script>
</body>
</html>
