<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hass Login</title>
  <link rel="icon" type="image/png" href="{{ url_for('logo') }}">
  <link rel="shortcut icon" href="{{ url_for('logo') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              {% if logo_exists %}
                <img src="{{ url_for('logo') }}" alt="Hass Logo" style="max-width: 150px;">
              {% endif %}
              <h4 class="mt-3">Hass Petroleum Secure Access</h4>
            </div>
            {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" name="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required>
              </div>
              <button class="btn btn-dark w-100" type="submit">Log In</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
